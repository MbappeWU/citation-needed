name: Release

# Push a tag such as v0.1.0, or publish a release by hand in the GitHub UI. Either way the
# release gets the offline reader, PDFs in English and Chinese, the data as JSON, the skill as
# a zip, and one share image per claim in both languages.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  # Run it by hand to check that everything builds: the files are kept as a workflow
  # artifact and no release is created.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: |
          node scripts/validate.mjs
          node scripts/build.mjs --check
      - name: Install a browser and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build the reader, the books and the PDFs
        run: |
          node scripts/build-site.mjs
          node scripts/build-book.mjs --pdf
          node scripts/build-assets.mjs cards
      - name: Collect assets
        run: |
          mkdir -p out
          cp _site/reader.html out/citation-needed-reader.html
          cp _site/claims.json out/claims.json
          cp dist/*.pdf out/
          (cd skills && zip -qr ../out/citation-needed-skill.zip citation-needed)
          (cd dist && zip -qr ../out/citation-needed-share-cards.zip cards)
      - name: Keep the files (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out
      - name: Create the release for a pushed tag
        if: ${{ github.event_name == 'push' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          elif [ -f ".github/release-notes/$TAG.md" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file ".github/release-notes/$TAG.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Upload assets
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: gh release upload "$TAG" out/* --clobber
