  function refsFor(c) { return c.sources.map(function (r, i) { var s = D.sources[r.id]; return "[" + (i + 1) + "] " + s.authors + " (" + s.year + "). " + s.title + (s.link ? " " + s.link : ""); }); }

  function briefMarkdown() {
    var t = T(), ids = briefIds(), out = ["# " + (state.title || t.defTitle), "", "_" + t.compiled + " https://github.com/" + D.repo + "_", ""];
    ids.forEach(function (id) {
      var c = claimById[id];
      out.push("## " + c.claim[state.lang], "", "**" + lbl("verdict", c.verdict) + " · " + t.grade + " " + c.grade + "**", "", c.evidence[state.lang], "", "> " + t.boss + ": " + c.boss_line[state.lang], "", t.limits + ": " + c.caveats[state.lang], "", refsFor(c).join("\n"), "");
    });
    return out.join("\n");
  }

  function renderBrief() {
    var t = T(), ids = briefIds(), h = '<div class="briefactions"><button type="button" data-act="back">← ' + t.back + '</button><button type="button" class="primary" data-act="print">' + t.print + '</button><button type="button" data-act="md">' + t.copymd + "</button></div>";
    h += '<div class="sheet"><input class="t" id="btitle" type="text" aria-label="Title" placeholder="' + esc(t.titleph) + '" value="' + esc(state.title) + '"><div class="meta">Citation Needed · github.com/' + D.repo + " · CC BY 4.0</div>";
    ids.forEach(function (id) {
      var c = claimById[id];
      h += '<div class="item"><div class="chips">' + verdictChip(c) + gradeChip(c) + "</div><h3>" + esc(c.claim[state.lang]) + "</h3><p>" + esc(c.evidence[state.lang]) + '</p><p class="say">' + esc(c.boss_line[state.lang]) + '</p><p><strong>' + t.limits + ":</strong> " + esc(c.caveats[state.lang]) + '</p><p class="refs">' + refsFor(c).map(esc).join("<br>") + "</p></div>";
    });
    h += '<div class="foot">' + esc(t.compiled) + "</div></div>";
    $("brief").innerHTML = h;
  }

  function renderStatic() {
    var t = T();
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    $("tagline").textContent = t.tag; $("stats").textContent = t.stats(D.counts); $("q").placeholder = t.search; $("foot").textContent = t.foot;
    $("zhname").style.display = state.lang === "zh" ? "none" : "";
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang)); });
  }

  function render() {
    renderStatic(); renderFilters(); renderList(); renderBar();
    document.body.classList.toggle("brief", state.view === "brief");
    if (state.view === "brief") renderBrief();
  }

  function copy(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = T().copied; setTimeout(function () { btn.textContent = o; }, 1500); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { window.prompt("", text); });
    else window.prompt("", text);
  }

  function openFromHash() {
    var id = decodeURIComponent((location.hash || "").slice(1));
    if (id && claimById[id]) {
      state.open = id; state.view = "list"; render();
      var el = document.getElementById(id); if (el) el.scrollIntoView({ block: "start" });
    }
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-lang],[data-topic],[data-verdict],[data-grade],[data-toggle],[data-copy],[data-act],[data-perma],[data-open],#bopen,#bclear");
    if (!el) return;
    if (el.hasAttribute("data-lang")) { state.lang = el.getAttribute("data-lang"); store.set("cn-lang", state.lang); render(); }
    else if (el.hasAttribute("data-topic")) { state.topic = el.getAttribute("data-topic"); renderFilters(); renderList(); }
    else if (el.hasAttribute("data-verdict")) { var v = el.getAttribute("data-verdict"); if (state.verdicts[v]) delete state.verdicts[v]; else state.verdicts[v] = true; renderFilters(); renderList(); }
    else if (el.hasAttribute("data-grade")) { var g = el.getAttribute("data-grade"); if (state.grades[g]) delete state.grades[g]; else state.grades[g] = true; renderFilters(); renderList(); }
    else if (el.hasAttribute("data-open")) { var oid = el.getAttribute("data-open"); state.open = oid; renderList(); try { history.replaceState(null, "", "#" + oid); } catch (err) { /* ignore */ } var oel = document.getElementById(oid); if (oel) oel.scrollIntoView({ block: "start" }); }
    else if (el.hasAttribute("data-toggle")) { var id = el.getAttribute("data-toggle"); state.open = state.open === id ? null : id; renderList(); if (state.open) { try { history.replaceState(null, "", "#" + id); } catch (err) { /* ignore */ } } }
    else if (el.hasAttribute("data-copy")) { var c = claimById[el.getAttribute("data-copy")]; copy(c.boss_line[state.lang], el); }
    else if (el.hasAttribute("data-perma")) { e.preventDefault(); copy(location.href.split("#")[0] + "#" + el.getAttribute("data-perma"), null); }
    else if (el.id === "bopen") { state.view = "brief"; render(); window.scrollTo(0, 0); }
    else if (el.id === "bclear") { state.brief = {}; store.set("cn-brief", "{}"); render(); }
    else if (el.getAttribute("data-act") === "back") { state.view = "list"; render(); }
    else if (el.getAttribute("data-act") === "print") { window.print(); }
    else if (el.getAttribute("data-act") === "md") { copy(briefMarkdown(), el); }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-add");
    if (!id) return;
    if (e.target.checked) state.brief[id] = true; else delete state.brief[id];
    store.set("cn-brief", JSON.stringify(state.brief)); renderBar();
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { state.q = e.target.value; renderList(); }
    else if (e.target.id === "btitle") state.title = e.target.value;
  });
  window.addEventListener("hashchange", openFromHash);

  render();
  openFromHash();
})();
</script>
</body>
</html>
